<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 / Page Not Found — Ahadex Tools</title>
    <meta name="description" content="The page you requested could not be found. Browse the Ahadex Tools library instead." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #090d16;
        --card: #111726;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --primary: #14b8a6;
        --primary-hover: #0d9488;
        --border: #1e293b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        max-width: 540px;
        width: 100%;
        padding: 40px 32px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--primary);
        background: rgba(20, 184, 166, 0.12);
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 16px;
      }
      h1 { font-size: 28px; margin-bottom: 12px; font-weight: 800; }
      p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary { background: var(--primary); color: #042f2e; }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
      .btn-ghost:hover { background: rgba(255, 255, 255, 0.05); }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">404 / Not Found</span>
      <h1>That page wandered off.</h1>
      <p>There is no tool or page at this address, but you can find all our free online browser utilities in the library.</p>
      <div class="actions">
        <a href="/tools" class="btn btn-primary">Browse All Tools</a>
        <a href="/" class="btn btn-ghost">Go to Home</a>
      </div>
    </div>
  </body>
</html>
